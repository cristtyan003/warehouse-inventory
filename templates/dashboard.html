<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D24726">
<meta name="format-detection" content="telephone=no">
<title>Warehouse Inventory</title>
<style>
:root {
  --orange: #d24726;
  --yellow: #ffcc00;
  --red: #d40511;
  --maroon: #692413;
  --green: #007f39;
  --dark: #3a3a3a;
  --bg: #f7f7f7;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --line: #dadada;
  --warn-bg: #fcebb8;
  --warn-text: #6b4e00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181818;
    --card: #242424;
    --text: #ededed;
    --muted: #a6a6a6;
    --line: #3a3a3a;
    --warn-bg: #4a3b14;
    --warn-text: #f4d98a;
  }
}
:root[data-theme="dark"] {
  --bg: #181818;
  --card: #242424;
  --text: #ededed;
  --muted: #a6a6a6;
  --line: #3a3a3a;
  --warn-bg: #4a3b14;
  --warn-text: #f4d98a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    "Apple Color Emoji",
    "Segoe UI Emoji",
    "Noto Color Emoji",
    sans-serif;
  font-weight: 400;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.navtop {
  background: var(--orange);
  display: flex;
  align-items: center;
  min-height: 56px;
  padding: 0 16px;
  gap: 14px;
  color: #fff;
  flex-wrap: wrap;
}
.logo {
  height: 38px;
  border-radius: 4px;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
}
.tabs {
  display: flex;
  gap: 4px;
  margin-left: 8px;
  flex: 0 0 auto; 
}
.tabs[hidden] {
  display: none;
}
.tab {
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  color: #f2e3d8;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
  transition:
    background 0.25s ease,
    transform 0.12s ease;
}
.tab.active {
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 65%), var(--maroon);
  color: #fff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 3px 10px rgba(0, 0, 0, 0.25);
}
.tab:active {
  transform: scale(0.96);
}
.navright {
  margin-left: auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  padding: 6px 0;
}
.userbadge {
  font-size: 11.5px;
  font-weight: 700;
  color: #f2e3d8;
  background: rgba(0, 0, 0, 0.25);
  padding: 6px 10px;
  border-radius: 8px;
  white-space: nowrap;
}
.logoutlink {
  font-size: 11.5px;
  font-weight: 700;
  color: #f2e3d8;
  text-decoration: none;
  padding: 6px 8px;
  border-radius: 8px;
  transition: background 0.15s ease;
}
.logoutlink:hover {
  background: rgba(0, 0, 0, 0.25);
}

body.view-only input.cell,
body.view-only #budgetInput,
body.view-only #btnAddItem,
body.view-only #btnRenameItem,
body.view-only #btnRemoveItem {
  pointer-events: none;
  opacity: 0.55;
  cursor: not-allowed;
}
select {
  font-family: inherit;
  background: var(--maroon);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 10px;
  font-weight: 700;
  font-size: 12.5px;
  transition:
    filter 0.15s ease,
    transform 0.12s ease,
    box-shadow 0.15s ease;
  cursor: pointer;
}
select:hover {
  filter: brightness(1.12);
}
select:focus {
  outline: none;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45);
}
select:active {
  transform: scale(0.96);
}
.themebtns {
  display: flex;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 8px;
  padding: 2px;
}
.themebtn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 15px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0.55;
  position: relative;
  overflow: hidden;
  position: relative;
  overflow: hidden;
  transition:
    background 0.2s ease,
    opacity 0.2s ease,
    transform 0.12s ease;
}
.themebtn.active {
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0) 65%), var(--maroon);
  opacity: 1;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.themebtn:active {
  transform: scale(0.88);
}
.navsub {
  background: var(--yellow);
  color: #252423;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.wrap {
  padding: 22px 16px 60px;
  max-width: 1550px;
  margin: 0 auto;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
}
.kpi .bar {
  height: 5px;
}
.kpi .body {
  padding: 14px 16px;
}
.kpi .val {
  font-weight: 700;
  font-size: 24px;
  display: block;
  white-space: nowrap;
}
.kpi .lbl {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 6px;
  display: block;
  letter-spacing: 0.2px;
}
h2 {
  font-size: 16px;
  margin: 0 0 4px;
}
.tag {
  background: var(--warn-bg);
  color: var(--warn-text);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 3px 9px;
  border-radius: 10px;
  display: inline-block;
  margin-left: 8px;
  vertical-align: middle;
}
.section {
  margin-bottom: 30px;
}
.chartbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 8px 4px 4px;
  margin-top: 10px;
  display: flex;
  align-items: flex-start;
}
.chartscroll {
  overflow-x: auto;
  flex: 1;
  min-width: 0;
}
.tablewrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-top: 10px;
  overflow: auto;
  max-height: 640px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12.5px;
  min-width: 1500px;
}
thead th {
  position: sticky;
  top: 0;
  background: var(--orange);
  color: #fff;
  text-align: left;
  padding: 9px 10px;
  font-weight: 700;
  z-index: 2;
}
tbody td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody tr:nth-child(even) {
  background: rgba(0, 0, 0, 0.02);
}
tbody tr.cat-first td {
  border-top: 2px solid var(--line);
}
tbody tr[draggable] {
  cursor: grab;
}
tbody tr.dragging {
  opacity: 0.4;
}
tbody tr.drag-over td {
  border-top: 2px dashed var(--orange);
}
.dragicon {
  color: var(--muted);
  margin-right: 4px;
}
input.cell {
  width: 78px;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
}
input.cell.money {
  width: 90px;
}
.inherited {
  color: var(--muted);
  font-size: 11.5px;
}
.searchbar {
  margin: 14px 0 4px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.searchbar input {
  flex: 1;
  max-width: 340px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-family: inherit;
}
.note {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 8px;
  font-style: italic;
  line-height: 1.5;
}
.savepill {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--maroon);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 700;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity 0.25s,
    transform 0.25s;
  pointer-events: none;
  z-index: 50;
}
.savepill.show {
  opacity: 1;
  transform: translateY(0);
}
.chip {
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 11.5px;
  font-weight: 700;
  position: relative;
  overflow: hidden;
  transition: transform 0.12s ease;
}
.chip:active {
  transform: scale(0.93);
}
.msd {
  position: relative;
  display: inline-block;
}
.msd-btn {
  font-family: inherit;
  background: var(--maroon);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition:
    transform 0.12s ease,
    filter 0.15s ease;
}
.msd-btn:hover {
  filter: brightness(1.08);
}
.msd-btn:active {
  transform: scale(0.95);
}
.msd-panel {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  z-index: 30;
  min-width: 260px;
  max-height: 280px;
  overflow: auto;
}
@keyframes panelOpen {
  from {
    opacity: 0;
    transform: translateY(-6px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes panelClose {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-6px) scale(0.97);
  }
}
.msd-panel.panel-opening {
  animation: panelOpen 0.16s ease;
}
.msd-panel.panel-closing {
  animation: panelClose 0.14s ease forwards;
}
.insight-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 14px;
}
.insight-card h3 {
  margin: 0 0 8px;
  font-size: 13.5px;
}
.insight-card ul {
  margin: 0;
  padding-left: 18px;
  font-size: 12.5px;
  line-height: 1.7;
}
svg.chart text {
  font-family: inherit;
  fill: var(--text);
}
.act-btn {
  font-family: inherit;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  border-radius: 8px;
  padding: 8px 12px;
  position: relative;
  overflow: hidden;
  transition:
    filter 0.15s ease,
    transform 0.12s ease,
    box-shadow 0.2s ease;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.act-btn:hover {
  filter: brightness(0.94);
}
.act-btn:active {
  transform: scale(0.94);
}
.act-btn.circle {
  width: 38px;
  height: 38px;
  padding: 0;
  border-radius: 50%;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.act-btn.danger:hover {
  border-color: var(--red);
  color: var(--red);
}
.act-btn.excel {
  background: #1d6f42;
  border-color: #1d6f42;
  color: #fff;
}
.act-btn.excel:hover {
  filter: brightness(1.12);
}
@keyframes overlayFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes overlayFadeOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
@keyframes modalPop {
  from {
    opacity: 0;
    transform: scale(0.92) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}
@keyframes modalPopOut {
  from {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  to {
    opacity: 0;
    transform: scale(0.94) translateY(8px);
  }
}
.modal-overlay.closing {
  animation: overlayFadeOut 0.18s ease forwards;
}
.modal-card.closing {
  animation: modalPopOut 0.18s ease forwards;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
  animation: overlayFade 0.18s ease;
}
.modal-card {
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 45%), var(--card);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 22px;
  width: 420px;
  max-width: 100%;
  box-shadow:
    0 16px 44px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-card h3 {
  margin: 0 0 12px;
  font-size: 16px;
}
.modal-card label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 4px;
}
.modal-card input[type="text"],
.modal-card select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  transition: box-shadow 0.15s ease;
}
.modal-card input[type="text"]:focus,
.modal-card select:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--orange);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}
.modal-btn {
  padding: 9px 18px;
  border-radius: 8px;
  border: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  transition:
    filter 0.15s ease,
    transform 0.12s ease;
}
.modal-btn:active {
  transform: scale(0.95);
}
.modal-btn.cancel {
  background: var(--red);
  color: #fff;
}
.modal-btn.confirm {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
}
.modal-btn.confirm:hover {
  filter: brightness(0.94);
}
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  mix-blend-mode: overlay;
  transform: scale(0);
  animation: rippleAnim 0.55s ease-out;
  pointer-events: none;
}
@keyframes rippleAnim {
  to {
    transform: scale(1);
    opacity: 0;
  }
}
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.fade-in {
  animation: fadeInUp 0.28s ease;
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

.bg-watermark {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  opacity: 0.05;
  font-size: 220px;
  line-height: 1;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 2vw;
  user-select: none;
}
.ag-pill.refused { background: rgba(212, 5, 17, 0.12); color: var(--red); border-color: var(--red); }
tr.ag-refused td { background: rgba(212, 5, 17, 0.04); }
.ag-icobtn.no:hover { color: var(--red); border-color: var(--red); }
.u-refusal { margin-top: 6px; font-size: 11.5px; line-height: 1.4; color: var(--muted); max-width: 260px; white-space: normal; }
.u-refusal b { color: var(--red); }
.bg-watermark svg { position: absolute; right: -40px; bottom: -30px; width: min(520px, 60vw); height: auto; }
.route-strip { gap: 14px; align-items: center; }
.route-strip {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.route-strip .safety-msg {
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--red);
}
:root[data-theme="dark"] .route-strip .safety-msg {
  color: var(--yellow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .route-strip .safety-msg {
    color: var(--yellow);
  }
}
.page-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 22px 16px 30px;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}
#app {
  position: relative;
  z-index: 1;
}

.menubtn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.22);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  padding: 0;
  flex: none;
  transition:
    background 0.2s ease,
    transform 0.12s ease;
}
.menubtn:hover {
  background: rgba(0, 0, 0, 0.36);
}
.menubtn:active {
  transform: scale(0.92);
}
.menubtn:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 2px;
}
.menubtn span {
  display: block;
  width: 22px;
  height: 3px;
  border-radius: 2px;
  background: #fff;
  transition:
    transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.2s ease;
}
.menubtn.open span:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}
.menubtn.open span:nth-child(2) {
  opacity: 0;
}
.menubtn.open span:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}
.side-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 0.3s ease,
    visibility 0s linear 0.3s;
  z-index: 150;
}
.side-overlay.open {
  opacity: 1;
  visibility: visible;
  transition:
    opacity 0.3s ease,
    visibility 0s;
}
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 300px;
  max-width: 86vw;
  background: var(--card);
  color: var(--text);
  z-index: 160;
  display: flex;
  flex-direction: column;
  transform: translateX(-102%);
  visibility: hidden;
  box-shadow: none;
  transition:
    transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 0.38s ease,
    visibility 0s linear 0.38s;
}
.sidebar.open {
  transform: translateX(0);
  visibility: visible;
  box-shadow: 10px 0 40px rgba(0, 0, 0, 0.35);
  transition:
    transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 0.38s ease,
    visibility 0s;
}
.side-head {
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 60%),
    var(--orange);
  color: #fff;
  padding: 22px 20px 18px;
  border-bottom: 5px solid var(--yellow);
}
.side-head .t {
  font-weight: 700;
  font-size: 16px;
  line-height: 1.25;
}
.side-head .s {
  font-size: 11.5px;
  opacity: 0.9;
  margin-top: 4px;
}
.side-nav {
  padding: 14px 12px;
  display: flex;

.page-hero {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 150px;
  margin-bottom: 22px;
  padding: 22px 28px;
  border-radius: 10px;
  background: linear-gradient(180deg, #ffcc00 0%, #ffd830 62%, #ffe98a 100%);
  box-shadow: 0 6px 20px rgba(210, 71, 38, 0.18);
}
.page-hero::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 5px;
  background: repeating-linear-gradient(90deg, var(--red) 0 34px, transparent 34px 44px);
  opacity: 0.85;
}
.page-hero .txt {
  position: relative;
  z-index: 1;
  max-width: 680px;
}

  color: var(--red);
  font-size: 13px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  font-weight: 400;
}
.page-hero h1 {
  margin: 4px 0 8px;
  color: var(--red);
  font-size: clamp(22px, 3.4vw, 34px);
  line-height: 1.05;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.page-hero p {
  margin: 0;
  color: #3a2a00;
  font-size: 13.5px;
  line-height: 1.5;
}
.page-hero .art {
  position: relative;
  z-index: 0;
  flex: none;
  width: min(420px, 46%);
  height: 150px;
}
.page-hero .art svg {
  width: 100%;
  height: 100%;
  display: block;
}
.hero-dots {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.hero-dots i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: block;
  border: 1px solid rgba(0, 0, 0, 0.12);
}
@keyframes planeFly {
  from {
    transform: translate(0, 0) rotate(-8deg);
  }
  to {
    transform: translate(14px, -7px) rotate(-8deg);
  }
}
@keyframes routeDash {
  to {
    stroke-dashoffset: -28;
  }
}
@keyframes pinPulse {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }
  15% {
    opacity: 0.7;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}
@keyframes vanBob {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-1.5px);
  }
}
@keyframes globeSpin {
  
  to {
    stroke-dashoffset: -56;
  }
}
.page-hero .plane {
  animation: planeFly 6s ease-in-out infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}
.page-hero .route {
  animation: routeDash 1.4s linear infinite;
}
.page-hero .van {
  animation: vanBob 0.9s ease-in-out infinite alternate;
}
.page-hero .pulse {
  transform-box: fill-box;
  transform-origin: center;
  animation: pinPulse 2.2s ease-out infinite;
}
.page-hero .globe-line {
  stroke-dasharray: 6 8;
  animation: globeSpin 5s linear infinite;
}

  content: "";

  font-size: 13px;

.home.enter .home-card:nth-child(2) {

}
.home.enter .home-card:nth-child(3) {

  to {
    opacity: 1;
    transform: none;
  }

.acc-info {

  flex-direction: column;
  gap: 5px;
  align-items: flex-start;
  min-width: 0;
}
.acc-info b {
  font-size: 15px;
}
.acc-info span.mail {
  font-size: 12px;
  color: var(--muted);
  word-break: break-all;
}
.acc-photo-actions {
  display: flex;
  gap: 8px;
  margin: 10px 0 2px;
  flex-wrap: wrap;
}
.acc-pass {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
}
.acc-pass summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 12.5px;
}
.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.lvl-desc {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
  min-height: 34px;
}
.modal-card label.us-switch {
  color: var(--text);
  font-size: 13px;
}
.us-switch {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.us-switch input {
  width: 18px;
  height: 18px;
  accent-color: var(--green);
}
.us-note {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
}
.us-wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 0 40px;
}
.us-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.us-stat {
  text-align: left;
  font-family: inherit;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 5px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  transition:
    transform 0.18s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}
.us-stat:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
}
.us-stat.active {
  border-color: var(--orange);
  box-shadow: 0 0 0 2px rgba(210, 71, 38, 0.3);
}
.us-stat .n {
  display: block;
  font-size: 24px;
  font-weight: 800;
}
.us-stat .l {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 700;
}
.us-stat[data-f="admin"] {
  border-top-color: var(--red);
}
.us-stat[data-f="editor"] {
  border-top-color: var(--orange);
}
.us-stat[data-f="manager"] {
  border-top-color: var(--yellow);
}
.us-stat[data-f="viewer"] {
  border-top-color: var(--dark);
}
.us-toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.us-toolbar .searchbar {
  flex: 1 1 260px;
  margin: 0;
}
.us-table {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}
.us-head,
.us-row {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 140px 120px 132px;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
}
.us-head {
  background: var(--orange);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 4px solid var(--yellow);
}
.us-row {
  border-bottom: 1px solid var(--line);
  transition: background 0.15s ease;
}
.us-row:last-child {
  border-bottom: 0;
}
.us-row:hover {
  background: rgba(255, 204, 0, 0.12);
}
.us-list.enter .us-row {
  animation: homeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  animation-delay: calc(var(--i, 0) * 35ms);
}
.us-row.blocked .us-user,
.us-row.blocked .us-role {
  opacity: 0.5;
}
.us-user {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.us-name {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.us-name b {
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.us-name small {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.us-me {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  font-weight: 800;
  background: var(--yellow);
  color: #3a2a00;
  padding: 1px 7px;
  border-radius: 999px;
  vertical-align: middle;
}
.us-status {
  font-size: 12.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
}
.us-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(0, 127, 57, 0.2);
}
.us-dot.off {
  background: var(--red);
  box-shadow: 0 0 0 3px rgba(212, 5, 17, 0.2);
}
.us-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}
.us-actions .act-btn.circle {
  width: 34px;
  height: 34px;
  font-size: 14px;
}
.us-actions .act-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.us-empty,
.us-loading {
  padding: 34px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
}
@media (max-width: 860px) {
  .us-stats {
    grid-template-columns: repeat(2, 1fr);
  }
  .us-head {
    display: none;
  }
  .us-row {
    grid-template-columns: 1fr auto;
  }
  .us-row .us-role,
  .us-row .us-status {
    grid-column: 1;
  }
  .us-row .us-actions {
    grid-column: 2;
    grid-row: 1 / span 3;
    flex-direction: column;
  }
}
@media (max-width: 640px) {
  .userchip .uname,
  .userchip .caret {
    display: none;
  }
  .userchip {
    padding: 3px;
  }
  .umenu {
    right: auto;
    left: 0;
    transform-origin: top left;
  }
}
@media (prefers-reduced-motion: reduce) {
  .umenu,
  .noaccess .na-ico,
  .us-list.enter .us-row {
    animation: none;
  }
}
.gate-note {
  margin: 0 0 14px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--muted);
}
.ag-subtabs {
  display: flex;
  gap: 8px;
  margin: 4px 0 16px;
  border-bottom: 3px solid var(--yellow);
  flex-wrap: wrap;
}
.ag-subtab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition:
    background 0.2s ease,
    color 0.2s ease,
    transform 0.12s ease;
}
.ag-subtab:hover {
  background: rgba(255, 204, 0, 0.25);
}
.ag-subtab:active {
  transform: scale(0.97);
}
.ag-subtab.on {
  background: var(--maroon);
  color: #fff;
  border-color: var(--maroon);
}
.ag-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.mg-cell {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
}
.mg-cell small {
  font-size: 11px;
  color: var(--muted);
}
.ag-pill.wait {
  background: rgba(255, 204, 0, 0.3);
  border-color: var(--yellow);
  color: var(--text);
}
.ag-pill.miss {
  background: rgba(212, 5, 17, 0.1);
  border-color: var(--red);
  color: var(--red);
}
.mg-who {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  font-weight: 700;
}
.mg-who small {
  display: block;
  font-weight: 400;
  color: var(--muted);
  font-size: 11.5px;
}
tr.mg-late td {
  background: rgba(212, 5, 17, 0.04);
}
tr.mg-ok td {
  background: rgba(0, 127, 57, 0.05);
}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em;flex:none}
</style>

<script>
let ITEMS = [];
const MONTH_NAMES = [
  "",
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December",
];
function fmtMoney(v) {
  if (v == null || isNaN(v)) return "—";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function catSlug(cat) {
  return cat
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}
function monthLabel(k) {
  const p = k.split("-");
  return MONTH_NAMES[parseInt(p[1], 10)] + "/" + p[0];
}
let CATS = [];
let CLEANING_CATS = [];

const state = {
  categories: {},
  monthly: {},
  itemTarget: {},
  budget: {},
};
function activeItems() {
  return ITEMS;
}
function findItem(id) {
  return ITEMS.find((i) => i.id === id);
}
function itemName(it) {
  return it.name;
}
function recomputeCatalog() {
  CATS = [...new Set(ITEMS.map((i) => i.cat))];
  CATS.forEach((c) => {
    if (!state.categories[c]) {
      state.categories[c] = { price: null, bulkQty: null, bulkPrice: null, cleaningPrice: null };
    }
  });
  CLEANING_CATS = CATS.filter((c) => state.categories[c].cleaningPrice != null);
  CATS.forEach((c) => {
    if (!CATEGORY_COLOR[c]) {
      CATEGORY_COLOR[c] = EXT_COLORS[Object.keys(CATEGORY_COLOR).length % EXT_COLORS.length];
    }
  });
  Object.keys(state.monthly).forEach((m) => {
    ITEMS.forEach((it) => {
      if (!state.monthly[m][it.id]) {
        state.monthly[m][it.id] = { stock: 0, outflow: 0, cleaning: 0, monthPurchase: 0 };
      }
    });
  });
  ITEMS.forEach((it) => {
    if (state.itemTarget[it.id] === undefined)
      state.itemTarget[it.id] = it.target != null ? it.target : null;
  });
}
function categoryAnchors() {
  const anchors = {};
  ITEMS.forEach((it) => {
    if (!(it.cat in anchors)) anchors[it.cat] = it.id;
  });
  return anchors;
}
function catTargetTotal(cat) {
  const ids = activeItems()
    .filter((i) => i.cat === cat)
    .map((i) => i.id);
  const vals = ids.map((id) => state.itemTarget[id]).filter((v) => v != null);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0);
}

const CAN_EDIT = {{ 'true' if can_edit else 'false' }};
const ME = {
  id: {{ user_id }},
  fullName: {{ full_name|tojson }},
  firstName: {{ first_name|tojson }},
  lastName: {{ last_name|tojson }},
  shortName: {{ short_name|tojson }},
  username: {{ username|tojson }},
  role: {{ role_key|tojson }},
  photoVersion: {{ photo_version }},
};
const CAN_MODULES = {{ 'true' if can_modules else 'false' }};
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
let safeDays = 0;
const MAX_SAFE_DAYS = 99999;
const REFERENCE_MONTH = "2026-09";
function ensureLocalMonth(month) {
  if (state.monthly[month]) return;
  const rec = {};
  activeItems().forEach((it) => {
    rec[it.id] = {
      stock: month === REFERENCE_MONTH ? it.stock : 0,
      outflow: 0,
      cleaning: 0,
      monthPurchase: 0,
    };
  });
  state.monthly[month] = rec;
}
function refreshMonthTouched(month) {
  if (month === REFERENCE_MONTH) return;
  const rec = state.monthly[month];
  if (!rec) {
    delete monthTouched[month];
    return;
  }
  const hasData =
    activeItems().some((it) => {
      const r = rec[it.id];
      return r && (r.stock || r.outflow || r.cleaning || r.monthPurchase);
    }) ||
    (state.budget[month] != null && state.budget[month] !== 0);
  if (hasData) monthTouched[month] = true;
  else delete monthTouched[month];
}

function currentCalendarMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function catStockTotals() {

function unitPriceForPurchase(cat, qtyNeeded) {
  const c = state.categories[cat];
  if (c.bulkQty != null && c.bulkPrice != null && qtyNeeded >= c.bulkQty) return c.bulkPrice;
  return c.price;
}
function computeKpis() {
  const totals = catStockTotals();
  let below = 0,
    invest = 0,
    totalStock = 0,
    totalOutflow = 0;
  activeItems().forEach((it) => {
    const r = getRow(it.id);
    totalStock += r.stock;
    totalOutflow += r.outflow;
  });
  CATS.forEach((cat) => {
    const target = catTargetTotal(cat),
      stock = totals[cat] || 0;
    if (target == null) return;
    if (stock < target) {
      below++;
      const need = target - stock;
      const unit = state.categories[cat].price;

}
function computeMonthlySpend(month) {
  const rec = state.monthly[month];
  if (!rec) return 0;
  let total = 0;
  activeItems().forEach((it) => {
    const r = rec[it.id];
    if (!r) return;
    const cat = state.categories[it.cat];
    const qty = r.monthPurchase || 0;
    if (qty > 0) {
      const unit = unitPriceForPurchase(it.cat, qty);
      if (unit != null) total += qty * unit;

    if (cat.cleaningPrice != null) total += (r.cleaning || 0) * cat.cleaningPrice;
  });

}
function computeBulkSavings(month) {
  const rec = state.monthly[month];
  if (!rec) return 0;
  let total = 0;
  activeItems().forEach((it) => {
    const r = rec[it.id];
    if (!r) return;
    const cat = state.categories[it.cat];
    const qty = r.monthPurchase || 0;
    if (
      qty > 0 &&
      cat.bulkQty != null &&
      cat.bulkPrice != null &&
      qty >= cat.bulkQty &&
      cat.price != null

      total += qty * (cat.price - cat.bulkPrice);

}
function computeCleaningMonth(month) {
  const rec = state.monthly[month];
  if (!rec) return 0;
  let total = 0;
  activeItems().forEach((it) => {
    const r = rec[it.id];

}
function computeAvailableBudget(month) {

function computeAnnualBudgetSpend(year) {
  let total = 0;
  for (let m = 1; m <= 12; m++) {

function niceStep(max, targetTicks) {
  targetTicks = targetTicks || 5;
  const rough = max / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1;
  else if (norm < 3) step = 2;

  return Math.max(1, step * mag);
}

  html += `<div class="insight-card"><h3>Low stock cover (at the average outflow rate)</h3><ul>${risk.length ? risk.map((x) => `<li><b>${escHtml(x.c)}</b> — lasts about ${x.months.toLocaleString("en-US", { maximumFractionDigits: 1 })} month(s) at the current rate</li>`).join("") : "<li>No category at immediate risk at the current average rate.</li>"}</ul></div>`;
  if (months.length >= 2) {
    const m1 = months[months.length - 2],
      m2 = months[months.length - 1];
    const deltas = CATS.map((c) => {
      const v1 = catOutflowByMonth(c, [m1])[0],
        v2 = catOutflowByMonth(c, [m2])[0];
      return { c, delta: v2 - v1, v1, v2 };
    })
      .filter((x) => x.v1 > 0 || x.v2 > 0)
      .sort((a, b) => b.delta - a.delta);
    const rose = deltas.slice(0, 3).filter((x) => x.delta > 0),
      fell = deltas
        .slice(-3)
        .filter((x) => x.delta < 0)
        .reverse();
    html += `<div class="insight-card"><h3>Trend (${monthLabel(m1)} → ${monthLabel(m2)})</h3><ul>
      ${rose.map((x) => `<li><b>${escHtml(x.c)}</b> rose from ${x.v1} to ${x.v2}</li>`).join("")}
      ${fell.map((x) => `<li><b>${escHtml(x.c)}</b> fell from ${x.v1} to ${x.v2}</li>`).join("")}
      ${!rose.length && !fell.length ? "<li>No relevant change between the last two months.</li>" : ""}
    </ul></div>`;
  }
  const bulkItems = CATS.filter(
    (c) =>
      state.categories[c].bulkQty != null &&
      state.categories[c].bulkPrice != null &&
      state.categories[c].price != null &&
      state.categories[c].bulkPrice < state.categories[c].price,
  );
  html += `<div class="insight-card"><h3>Savings available with bulk purchases</h3><ul>${
    bulkItems.length
      ? bulkItems
          .map((c) => {
            const dif = state.categories[c].price - state.categories[c].bulkPrice;
            return `<li><b>${escHtml(c)}</b> — saves ${fmtMoney(dif)} per unit when buying ${state.categories[c].bulkQty}+ at once</li>`;
          })
          .join("")
      : "<li>No category has a bulk price set yet (fill it in on the Stock tab).</li>"
  }</ul></div>`;
  app.innerHTML = html;
}

let dragSourceId = null;
function wireRowDrag(tbody) {
  tbody.querySelectorAll("tr[draggable]").forEach((tr) => {
    tr.addEventListener("dragstart", () => {
      dragSourceId = tr.dataset.dragid;
      tr.classList.add("dragging");
    });
    tr.addEventListener("dragend", () => {
      tr.classList.remove("dragging");
      tbody.querySelectorAll("tr").forEach((x) => x.classList.remove("drag-over"));
    });
    tr.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (tr.dataset.dragid !== dragSourceId) tr.classList.add("drag-over");
    });
    tr.addEventListener("dragleave", () => {
      tr.classList.remove("drag-over");
    });
    tr.addEventListener("drop", (e) => {
      e.preventDefault();
      tr.classList.remove("drag-over");
      const targetId = tr.dataset.dragid;
      if (!dragSourceId || dragSourceId === targetId) return;
      const fromIdx = ITEMS.findIndex((i) => i.id === dragSourceId);
      if (fromIdx < 0 || ITEMS.findIndex((i) => i.id === targetId) < 0) return;
      const [moved] = ITEMS.splice(fromIdx, 1);
      const toIdx = ITEMS.findIndex((i) => i.id === targetId);
      ITEMS.splice(toIdx, 0, moved);
      dragSourceId = null;
      render();
      persistReorder();
    });
  });
}

function removeModalImmediate() {
  const el = document.getElementById("modalOverlay");
  if (el) el.remove();
  document.removeEventListener("keydown", modalEscHandler);
}
function openModal(html, onMount) {
  removeModalImmediate();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal-card" id="modalCard">${html}</div>`;
  overlay.addEventListener("click", (e) => {
    if (e.target !== overlay) return;
    if (overlay.querySelector("input, textarea, select, .opt-card, .item-card, .cal-grid")) {
      const card = document.getElementById("modalCard");
      if (card) {
        card.classList.remove("nudge");
        void card.offsetWidth;
        card.classList.add("nudge");
      }
      return;
    }
    closeModal();
  });
  document.body.appendChild(overlay);
  document.addEventListener("keydown", modalEscHandler);
  if (onMount) onMount(document.getElementById("modalCard"));
}
function modalEscHandler(e) {
  if (e.key === "Escape") closeModal();
}
function closeModal() {
  const el = document.getElementById("modalOverlay");
  if (!el) return;
  document.removeEventListener("keydown", modalEscHandler);
  const card = document.getElementById("modalCard");
  el.classList.add("closing");
  if (card) card.classList.add("closing");
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 180);
}

function exportToExcel() {
  const rows = [
    [
      "Item",
      "Unit",
      "Current stock",
      "Monthly target",
      "Outflow",
      "Monthly purchase",
      "Unit price",
      "Stock value",
      "Bulk: min. qty",
      "Bulk: unit price",
      "Cleaning (qty)",
      "Cleaning price (unit)",
    ],
  ];
  activeItems().forEach((it) => {
    const r = getRow(it.id);
    rows.push([
      r.name,
      r.unit,
      r.stock,
      r.target != null ? r.target : "",
      r.outflow,
      r.monthPurchase,
      r.price != null ? r.price : "",
      r.price != null ? r.stock * r.price : "",
      r.bulkQty != null ? r.bulkQty : "",
      r.bulkPrice != null ? r.bulkPrice : "",
      r.cleaning,
      r.cleaningPrice != null ? r.cleaningPrice : "",
    ]);
  });
  rows.push([]);
  rows.push([
    "Monthly budget",
    state.budget[currentMonth] != null ? state.budget[currentMonth] : "",
  ]);
  rows.push(["Monthly spend", computeMonthlySpend(currentMonth)]);
  rows.push(["Available budget", computeAvailableBudget(currentMonth)]);
  const csv = rows
    .map((r) =>
      r
        .map((c) => {
          if (c == null) return "";
          const s = String(c).replace(/"/g, '""');
          return /[";\n]/.test(s) ? '"' + s + '"' : s;
        })
        .join(";"),
    )
    .join("\r\n");
  const fileName = "PPE_Stock_" + monthLabel(currentMonth).replace("/", "-") + ".csv";
  try {
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) {
    alert("Could not generate the file. Please try again in a moment.");
  }

function pad2(n) {
  return String(n).padStart(2, "0");
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());

function fmtDate(iso) {
  const p = iso.split("-");
  const wd = new Date(+p[0], +p[1] - 1, +p[2])
    .toLocaleDateString("en-US", { weekday: "short" })
    .replace(".", "");
  return p[2] + "/" + p[1] + "/" + p[0] + " · " + wd;
}

async function postAction(url, body) {
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let data = null;
    try {
      data = await r.json();
    } catch (e) {
      data = null;
    }
    if (sessionEnded(r)) return { ok: false, error: "Your session has ended. Please sign in again." };
    if (!r.ok) {
      const msg =
        (data && data.error) ||
        (r.status === 403
          ? "Your account is not allowed to do this."
          : "Could not save (error " + r.status + ").");
      return { ok: false, error: msg };
    }
    setOnlineStatus(true);
    showSave();
    return { ok: true, data };
  } catch (e) {
    setOnlineStatus(false);
    return { ok: false, error: "No connection to the server." };
  }
}

function managerRows() {
  const month = routineOfMonth();
  return (managersList || []).map((m) => {
    const mine = month.filter((a) => a.userId === m.id);
    const stat = (routine) => {
      const rel = mine.filter((a) => a.routine === routine || a.routine === "Both");
      return { done: rel.filter((a) => a.done).length, open: rel.filter((a) => !a.done).length };
    };
    const bbs = stat("BBS");
    const dsw = stat("DSW");
    return { ...m, bbs, dsw, ok: bbs.done > 0 && dsw.done > 0 };
  });
}

async function onRoutineListClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn || !CAN_EDIT) return;
  const id = Number(btn.dataset.id);
  const row = routines.find((a) => a.id === id);
  if (!row) return;
  if (btn.dataset.act === "toggle") {
    const res = await postAction("/api/schedules/status", { id, done: !row.done });
    if (res.ok) {
      row.done = res.data.done;
      render();
    } else alert(res.error);
  } else if (btn.dataset.act === "delete") {
    openModal(
      `<h3>Delete routine</h3>
       <p style="font-size:13px;line-height:1.55;margin:0;">Delete the <b>${escHtml(row.routine)}</b> routine for <b>${escHtml(row.name)}</b> on <b>${fmtDate(row.date)}</b>? This cannot be undone.</p>

       </div>`,
      (card) => {
        card.querySelector("#mCancel").addEventListener("click", closeModal);
        card.querySelector("#mConfirm").addEventListener("click", async () => {
          const res = await postAction("/api/schedules/delete", { id });

            alert(res.error);
            return;

          routines = routines.filter((a) => a.id !== id);
          closeModal();
          render();
        });
      },
    );
  }
}

const AVATAR_COLORS = ["#d24726", "#692413", "#d40511", "#007f39", "#3a3a3a", "#b8860b"];
const NAME_SKIP = ["de", "da", "do", "das", "dos", "e", "di", "du", "van", "von", "der", "la", "le"];

function initialsOf(name) {
  const words = String(name || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);
  if (!words.length) return "?";
  const rest = words.slice(1).filter((w) => !NAME_SKIP.includes(w.toLowerCase()));
  const second = rest[0] || "";
  return (words[0][0] + (second ? second[0] : "")).toUpperCase();
}
function avatarHtml(u, size) {
  const label = u.fullName || u.shortName || u.username || "";
  if (u.photoVersion > 0) {
    return `<span class="avatar ${size}"><img src="/avatar/${u.id}?v=${u.photoVersion}" alt="" loading="lazy"></span>`;
  }
  const color = AVATAR_COLORS[Math.abs(Number(u.id) || 0) % AVATAR_COLORS.length];
  return `<span class="avatar ${size}" style="--av:${color}" aria-hidden="true">${escHtml(initialsOf(label || u.username))}</span>`;
}
function roleBadge(key) {
  const info = ROLE_INFO[key] || ROLE_INFO.viewer;
  return `<span class="rolebadge ${escHtml(key)}">${info.label}</span>`;
}
function shortNameOf(first, last, username) {
  const words = `${first || ""} ${last || ""}`.trim().split(/\s+/).filter(Boolean);
  if (!words.length) return String(username || "").split("@")[0];
  const second = words.slice(1).find((w) => !NAME_SKIP.includes(w.toLowerCase()));
  return second ? words[0] + " " + second : words[0];
}

function imageToJpeg(file, size) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) {
      reject(new Error("Choose an image file (JPG, PNG or WebP)."));
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      reject(new Error("The image is too large (15 MB maximum)."));
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const g = canvas.getContext("2d");
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, size, size);
      g.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Could not open this image. Use JPG, PNG or WebP."));
    };
    img.src = url;
  });
}

function toggleUserBlock(u) {

  };

  openModal(
    `<h3>Block access?</h3>

    (card) => {

async function onUniformListClick(e) {
  const btn = e.target.closest("[data-act]");
  if (!btn || !CAN_EDIT) return;
  const id = Number(btn.dataset.id);
  const row = uniRequests.find((r) => r.id === id);
  if (!row) return;
  if (btn.dataset.act === "toggle") {
    const reopen = row.done || row.refused;
    const res = reopen
      ? await postAction("/api/uniform-requests/status", { id, done: false })
      : await postAction("/api/uniform-requests/status", { id, done: true });
    if (res.ok && reopen && row.refused) {
      const r2 = await postAction("/api/uniform-requests/refuse", { id, refused: false });
      if (r2.ok) Object.assign(row, r2.data);
    } else if (res.ok) Object.assign(row, res.data);
    if (res.ok) render();
    else alert(res.error);
  } else if (btn.dataset.act === "refuse") {
    openModal(
      `<h3>✕ Not delivered</h3>
       <p style="font-size:13px;line-height:1.55;margin:0 0 8px;">Why were the items for <b>${escHtml(row.employee)}</b> (${escHtml(row.kind)}: ${escHtml(row.items.join(", "))}) not delivered? The manager <b>${escHtml(row.manager)}</b> will see this justification.</p>
       <label>Justification</label>
       <textarea id="rfReason" rows="4" maxlength="500" placeholder="E.g. requested size out of stock, restock expected next week..." style="width:100%;box-sizing:border-box;"></textarea>
       <div class="ag-err" id="rfErr" hidden></div>
       <div class="modal-actions">
         <button class="modal-btn cancel" id="mCancel">Cancel</button>
         <button class="modal-btn confirm" id="mConfirm" style="color:var(--red);">Record non-delivery</button>
       </div>`,
      (card) => {
        const ta = card.querySelector("#rfReason");
        ta.focus();
        card.querySelector("#mCancel").addEventListener("click", closeModal);
        card.querySelector("#mConfirm").addEventListener("click", async () => {
          const res = await postAction("/api/uniform-requests/refuse", { id, reason: ta.value });
          if (!res.ok) {
            const er = card.querySelector("#rfErr");
            er.textContent = res.error;
            er.hidden = false;
            return;
          }
          Object.assign(row, res.data);
          closeModal();
          render();
        });
      },
    );
  } else if (btn.dataset.act === "delete") {
    openModal(
      `<h3>Delete request</h3>
       <p style="font-size:13px;line-height:1.55;margin:0;">Delete the request for <b>${escHtml(row.employee)}</b> (${escHtml(row.kind)}: ${escHtml(row.items.join(", "))}) opened by <b>${escHtml(row.manager)}</b>? This cannot be undone.</p>
       <div class="modal-actions">
         <button class="modal-btn cancel" id="mCancel">Cancel</button>
         <button class="modal-btn confirm" id="mConfirm" style="color:var(--red);">Delete</button>
       </div>`,
      (card) => {
        card.querySelector("#mCancel").addEventListener("click", closeModal);
        card.querySelector("#mConfirm").addEventListener("click", async () => {
          const res = await postAction("/api/uniform-requests/delete", { id });
          if (!res.ok) {
            alert(res.error);
            return;
          }
          uniRequests = uniRequests.filter((r) => r.id !== id);
          closeModal();
          render();
        });
      },
    );
  }
}

function openNewUniform() {
  if (!ME.fullName) {
    promptProfileName(openNewUniform);
    return;
  }
  const sel = { kind: null, shift: null, items: new Set() };
  const kinds = UNIFORM_KINDS.map(
    (k) =>
      `<button type="button" class="opt-card" data-kind="${k.v}">${k.ico ? `<span class="ic">${k.ico}</span>` : ""}${k.t}<span class="tick">✓</span></button>`,
  ).join("");
  const shifts = UNIFORM_SHIFTS.map(
    (s) => `<button type="button" class="opt-card sm" data-shift="${s}">${s}</button>`,
  ).join("");
  const items = UNIFORM_ITEMS.map(
    (i) =>
      `<button type="button" class="opt-card sm" data-item="${i.v}">${i.ico ? `<span class="ic">${i.ico}</span>` : ""}${i.v}<span class="tick">✓</span></button>`,
  ).join("");
  openModal(
    `<h3>New uniform / PPE request</h3>
     <div class="ag-who">Manager: <b>${escHtml(ME.fullName)}</b> · filled in automatically</div>
     <label>Employee's full name</label>
     <input type="text" id="uEmp" maxlength="120" autocomplete="off">
     <label>Select the request type</label>
     <div class="opt-row two">${kinds}</div>
     <label>Employee's shift</label>
     <div class="opt-row four">${shifts}</div>
     <label>Select the item(s) you want to request</label>
     <div class="item-grid">${items}</div>
     <label>Reason for the issue/replacement</label>
     <div class="hint-warn">Describe the reason in detail. Requests without enough detail may not be fulfilled.</div>
     <textarea id="uReason" maxlength="500" rows="3" placeholder="E.g. pants torn at the knee, need to swap size 42 for 44..."></textarea>
     <div class="char-count"><span id="uCount">0</span>/500</div>
     <div class="ag-err" id="mErr" style="display:none"></div>
     <div class="modal-actions">
       <button class="modal-btn cancel" id="mCancel">Cancel</button>
       <button class="modal-btn confirm go" id="mConfirm">Submit request</button>
     </div>`,
    (card) => {
      card.classList.add("wide");
      const err = card.querySelector("#mErr");
      const showErr = (t) => {
        err.textContent = t;
        err.style.display = "block";
      };
      card.querySelector("#uEmp").focus();
      card.querySelectorAll("[data-kind]").forEach((b) =>
        b.addEventListener("click", () => {
          sel.kind = b.dataset.kind;
          card.querySelectorAll("[data-kind]").forEach((x) => x.classList.toggle("on", x === b));
        }),
      );
      card.querySelectorAll("[data-shift]").forEach((b) =>
        b.addEventListener("click", () => {
          sel.shift = b.dataset.shift;
          card.querySelectorAll("[data-shift]").forEach((x) => x.classList.toggle("on", x === b));
        }),
      );
      card.querySelectorAll("[data-item]").forEach((b) =>
        b.addEventListener("click", () => {
          const v = b.dataset.item;
          if (sel.items.has(v)) sel.items.delete(v);
          else sel.items.add(v);
          b.classList.toggle("on", sel.items.has(v));
        }),
      );
      const reason = card.querySelector("#uReason");
      reason.addEventListener("input", () => {
        card.querySelector("#uCount").textContent = reason.value.length;
      });
      card.querySelector("#mCancel").addEventListener("click", closeModal);
      card.querySelector("#mConfirm").addEventListener("click", async (ev) => {
        const employee = card.querySelector("#uEmp").value.trim().replace(/\s+/g, " ");
        if (employee.split(" ").length < 2 || employee.split(" ")[1] === "")
          return showErr("Enter the employee's full name (first and last name).");
        if (!sel.kind) return showErr("Choose the type: first issue or replacement.");
        if (!sel.shift) return showErr("Choose the employee's shift.");
        if (sel.items.size === 0) return showErr("Select at least one item.");
        if (reason.value.trim().length < 10)
          return showErr("Describe the reason (at least 10 characters); requests without detail are not fulfilled.");
        const btn = ev.currentTarget;
        btn.disabled = true;
        const res = await postAction("/api/uniform-requests", {
          employee,
          kind: sel.kind,
          shift: sel.shift,
          items: Array.from(sel.items),
          reason: reason.value,
        });
        btn.disabled = false;
        if (!res.ok) return showErr(res.error);
        uniRequests.unshift(res.data);
        closeModal();
        const now = currentCalendarMonth();
        if (!uniAllMonths && currentMonth !== now) goToMonth(now);
        else render();
      });
    },
  );
}

function sessionEnded(r) {
  if (r.redirected && /\/login/.test(r.url)) {
    window.location.href = "/login";
    return true;
  }
  return false;
}
async function apiGet(url) {
  try {
    const r = await fetch(url, { cache: "no-store" });
    if (sessionEnded(r)) return null;
    if (!r.ok) throw new Error("HTTP " + r.status);
    setOnlineStatus(true);
    return await r.json();
  } catch (e) {
    setOnlineStatus(false);
    return null;
  }
}
async function apiPost(url, body) {
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (sessionEnded(r)) return null;
    if (r.status === 403) {
      alert("Your account is view-only — this change was not saved.");
      return null;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    setOnlineStatus(true);
    showSave();
    return await r.json();
  } catch (e) {
    setOnlineStatus(false);
    return null;
  }
}
function setOnlineStatus(ok) {
  isOnline = ok;
  const el = document.getElementById("dbStatus");
  if (!el) return;
  el.innerHTML = ok
    ? '<span style="color:var(--green)">● Connected</span>'
    : '<span style="color:var(--red)">⚠ No connection to the server</span>';
}
function setSafeDays(n) {
  n = Math.max(0, Math.min(MAX_SAFE_DAYS, parseInt(n, 10) || 0));
  const changed = n !== safeDays;
  safeDays = n;
  const box = document.getElementById("safeDays");
  const num = document.getElementById("safeDaysNum");
  if (!box || !num) return;
  const txt = n.toLocaleString("en-US");
  num.textContent = txt;
  box.dataset.len = String(txt.length);
  box.title = n + " days without lost-time accidents";
  if (changed) {
    box.classList.remove("sd-pop");
    void box.offsetWidth;
    box.classList.add("sd-pop");
  }
}
function openSafeDaysEditor() {
  if (!CAN_EDIT) return;
  openModal(
    `<h3>Days without lost-time accidents</h3>
     <label>How many days have we gone without a lost-time accident?</label>
     <input type="text" id="sdInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" value="${safeDays}">
     <p class="sd-modal-hint">Numbers only, from 0 to ${MAX_SAFE_DAYS}. Every user sees this number at the top of the site.</p>
     <div class="ag-err" id="sdErr" hidden></div>
     <div class="modal-actions">
       <button class="modal-btn cancel" id="mCancel">Cancel</button>
       <button class="modal-btn confirm" id="mConfirm">Save</button>
     </div>`,
    (card) => {
      const inp = card.querySelector("#sdInput");
      inp.focus();
      inp.select();
      inp.addEventListener("input", () => {
        inp.value = inp.value.replace(/\D/g, "").slice(0, 5);
      });
      const save = async () => {
        const res = await postAction("/api/safe-days", { days: inp.value });
        if (!res.ok) {
          const er = card.querySelector("#sdErr");
          er.textContent = res.error;
          er.hidden = false;
          return;
        }
        setSafeDays(res.data.safeDays);
        closeModal();
      };
      card.querySelector("#mCancel").addEventListener("click", closeModal);
      card.querySelector("#mConfirm").addEventListener("click", save);
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") save();
      });
    },
  );
}
function setupSafeDays() {
  const btn = document.getElementById("safeDaysEdit");
  if (CAN_EDIT) {
    btn.hidden = false;
    btn.addEventListener("click", openSafeDaysEditor);
    document.getElementById("safeDays").addEventListener("dblclick", openSafeDaysEditor);
  }
  setSafeDays(safeDays);
}

async function reloadCatalog() {
  const data = await apiGet("/api/bootstrap");
  if (!data) return false;
  setSafeDays(data.safeDays);
  applySupportEmail(data.supportEmail);
  ITEMS = data.items;
  Object.keys(data.categories).forEach((name) => {
    state.categories[name] = data.categories[name];
  });
  ITEMS.forEach((it) => {
    state.itemTarget[it.id] = it.target;
  });
  recomputeCatalog();
  return true;
}
async function loadMonthFromDbOnce(month) {
  if (monthLoadedFromDb[month]) return;
  if (month < REFERENCE_MONTH) {
    monthLoadedFromDb[month] = true;
    return;
  }
  const records = await apiGet("/api/month/" + encodeURIComponent(month));
  if (records) {
    ensureLocalMonth(month);
    Object.keys(records).forEach((itemId) => {
      state.monthly[month][itemId] = records[itemId];
    });
    refreshMonthTouched(month);
    monthLoadedFromDb[month] = true;
    if (currentMonth === month && activeTab === "stock") render();
    if (activeTab === "cons" || activeTab === "insights") render();
  }
}
async function loadBudgetFromDbOnce() {
  const data = await apiGet("/api/budget");
  if (!data) return;
  Object.keys(data).forEach((m) => {
    state.budget[m] = data[m];
  });
  Object.keys(state.monthly).forEach(refreshMonthTouched);
}
const SYNC_INTERVAL_MS = 2000;
let lastSyncVersion = null;
let syncRunning = false;
let pendingRefresh = false;

function isUserBusy() {
  const el = document.activeElement;
  const typing =
    !!el &&
    !!el.closest &&
    !!el.closest("#app") &&
    ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName);
  const modalOpen = !!document.getElementById("modalOverlay");
  const panelOpen = Array.from(document.querySelectorAll(".msd-panel")).some(
    (p) => p.style.display === "block",
  );
  return typing || modalOpen || panelOpen || dragSourceId !== null;
}

async function pullFromServer() {
  const allMonths = consolidatedLoaded;
  const fetchMonths = allMonths || currentMonth >= REFERENCE_MONTH;
  const [catalog, budget, months, schedules, uniforms] = await Promise.all([
    apiGet("/api/bootstrap"),
    apiGet("/api/budget"),
    !fetchMonths
      ? Promise.resolve({})
      : allMonths
        ? apiGet("/api/months")
        : apiGet("/api/month/" + encodeURIComponent(currentMonth)),
    apiGet("/api/schedules"),
    apiGet("/api/uniform-requests"),
  ]);
  if (!catalog || !budget || !months || !schedules || !uniforms) return false;
  setSafeDays(catalog.safeDays);
  applySupportEmail(catalog.supportEmail);
  if (catalog.me && catalog.me.role !== ME.role) {
    window.location.reload();
    return false;
  }
  if (catalog.me) {
    const m = catalog.me;
    const changed =
      m.fullName !== ME.fullName || m.photoVersion !== ME.photoVersion || m.shortName !== ME.shortName;
    Object.assign(ME, {
      fullName: m.fullName,
      firstName: m.firstName,
      lastName: m.lastName,
      shortName: m.shortName,
      photoVersion: m.photoVersion,
    });
    if (changed) renderUserChip();
  }
  if (CAN_EDIT && activeTab === "routines") {
    const fresh = await apiGet("/api/managers");
    if (fresh) managersList = fresh;
  }
  if (IS_ADMIN && activeTab === "users") {
    const fresh = await apiGet("/api/users");
    if (fresh) usersList = fresh;
  }
  routines = schedules;
  uniRequests = uniforms;
  const byMonth = allMonths ? months : { [currentMonth]: months };

  ITEMS = catalog.items;
  Object.keys(catalog.categories).forEach((name) => {
    if (!isRecent("cat:" + name)) state.categories[name] = catalog.categories[name];
  });
  ITEMS.forEach((it) => {
    if (!isRecent("target:" + it.id)) state.itemTarget[it.id] = it.target;
  });
  Object.keys(budget).forEach((month) => {
    if (!isRecent("budget:" + month)) state.budget[month] = budget[month];
  });
  recomputeCatalog();

  Object.keys(byMonth).forEach((month) => {
    if (month < REFERENCE_MONTH) return;
    ensureLocalMonth(month);
    Object.keys(byMonth[month]).forEach((itemId) => {
      if (isRecent("m:" + month + ":" + itemId)) return;
      state.monthly[month][itemId] = byMonth[month][itemId];
    });
  });
  Object.keys(state.monthly).forEach(refreshMonthTouched);

  monthLoadedFromDb = {};
  monthLoadedFromDb[currentMonth] = true;
  return true;
}

function refreshView() {
  if (isUserBusy()) {
    pendingRefresh = true;
    return;
  }
  pendingRefresh = false;
  const chartScrolls = {};
  document.querySelectorAll(".chartbox").forEach((box) => {
    const scroller = box.querySelector(".chartscroll");
    if (box.id && scroller) chartScrolls[box.id] = scroller.scrollLeft;
  });
  const pageY = window.scrollY;
  render();
  Object.keys(chartScrolls).forEach((id) => {
    const scroller = document.querySelector("#" + id + " .chartscroll");
    if (scroller) scroller.scrollLeft = chartScrolls[id];
  });
  window.scrollTo(0, pageY);
}

async function checkForRemoteChanges() {
  if (syncRunning || document.hidden) return;
  syncRunning = true;
  try {
    const current = await apiGet("/api/version");
    if (!current) return;
    if (current.version !== lastSyncVersion) {
      if (await pullFromServer()) {
        lastSyncVersion = current.version;
        refreshView();
      }
    } else if (pendingRefresh) {
      refreshView();
    }
  } finally {
    syncRunning = false;
  }
}

function startRealtimeSync() {
  setInterval(checkForRemoteChanges, SYNC_INTERVAL_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checkForRemoteChanges();
  });
}
async function connectServer() {
  const initial = await apiGet("/api/version");
  lastSyncVersion = initial ? initial.version : null;
  const ok = await reloadCatalog();
  setOnlineStatus(ok);
  if (!ok) return;
  ensureLocalMonth(currentMonth);
  render();
  await loadBudgetFromDbOnce();
  await loadMonthFromDbOnce(currentMonth);
  await loadSchedules();
  await loadUniforms();
  if (nameGateNeeded()) openNameGate();
  startRealtimeSync();
}
function initRippleEffect() {
  document.body.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab, .act-btn, .modal-btn, .themebtn, .msd-btn, .chip, .side-item, .opt-card, .ag-icobtn");
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.8;
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = e.clientX - rect.left - size / 2 + "px";
    ripple.style.top = e.clientY - rect.top - size / 2 + "px";
    btn.appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
  });
}
function triggerFadeIn() {
  const app = document.getElementById("app");
  if (!app) return;
  app.classList.remove("fade-in");
  void app.offsetWidth;
  app.classList.add("fade-in");
}
function setFavicon() {
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#d24726"/><path d="M14 26l18-10 18 10v22H14z" fill="#ffcc00"/><rect x="26" y="34" width="12" height="14" fill="#692413"/></svg>';
  let link = document.querySelector('link[rel="icon"]');
  if (!link) {
    link = document.createElement("link");
    link.rel = "icon";
    document.head.appendChild(link);
  }
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
}
function boot() {
  setupChrome();
  setupSidebar();
  initRippleEffect();
  setFavicon();
  connectServer();
}
boot();
</script>
